{# Call-to-action button with the plain link underneath, for mail clients that block or restyle buttons. Needs: url, label. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
  <tr>
    <td align="center" bgcolor="#1976d2" style="border-radius:6px;background-color:#1976d2;">
      <a href="{{ url }}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;line-height:20px;color:#ffffff;text-decoration:none;border-radius:6px;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 16px 0;font-size:13px;line-height:20px;color:#6b7785;">
  If the button does not work, copy this link into your browser:<br>
  <a href="{{ url }}" style="color:#1976d2;word-break:break-all;">{{ url }}</a>
</p>
