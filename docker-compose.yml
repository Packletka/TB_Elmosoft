services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - backend/.env.db

  django-web:
    build: ..
    container_name: django-docker
    depends_on:
      - db
    volumes:
      - ./static:/app/staticfiles
      - ./backend:/app
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - backend/.env.django
      - backend/.env.redis
      - backend/.env.db

#  taken from habr
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    env_file:
      - backend/.env.redis
volumes:
  postgres_data:
  redis_data:
