[project]
name = "tb-elmosoft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "packletka", email = "pavel.azyava@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django==6.1",
    "djangorestframework==3.18.0",
    "gunicorn==26.0.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "redis==8.0.0",
    "uv==0.12.3",
    "whitenoise==6.12.0",
    "django-phonenumber-field==8.5.0",
    "phonenumberslite==9.0.37",
    "pillow==12.3.0",
]

# Commented out in order to avoid an error like
# Failed to build `tb-elmosoft @ file:///home/packletka/TB_Elmosoft`
#  ╰─▶ Expected a Python module at: src/tb_elmosoft/__init__.py

#[build-system]
#requires = ["uv_build>=0.12.3,<0.13.0"]
#build-backend = "uv_build"
#module-name = "backend"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.16.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "E501",
    "I",
    "DJ", # https://docs.astral.sh/ruff/rules/#flake8-django-dj
    "B", # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "SIM", # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["RUF012", "E501"]
