[project]
name = "tb-elmosoft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "packletka", email = "pavel.azyava@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django==6.1",
    "djangorestframework==3.18.0",
    "gunicorn==26.0.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "redis==8.0.0",
    "uv==0.12.3",
    "whitenoise==6.12.0",
    "pre_commit==4.6.2",
    "black==26.5.1",
    "isort==8.0.1",
    "flake8==7.3.0",
    "ruff==0.16.3",
    "flake8-pyproject==1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
module-name = "backend"

[tool.black]
line-length=120
exclude='''
.venv/
.idea/
'''

#[tool.isort]
#profile = "black"
#include_trailing_comma = true
#line_length = 120
#lines_after_imports = 2
#skip = [
#    "__init__.py",
#]

[tool.flake8]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "__init__.py",
]
max-line-length = 120
ignore = [

]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # black already does it
